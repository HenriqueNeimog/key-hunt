{% extends "base.html" %}
{% block title %}Rodada — Key Hunt{% endblock %}
{% block page %}game{% endblock %}
{% block content %}
<section class="game-shell" data-round-id="{{ round_id | default('') | e }}"
         data-session-id="{{ session_id | default('') | e }}" aria-labelledby="track-title">
  <article class="music-stage skeleton" id="music-stage">
    <div class="ambient-cover" id="ambient-cover" aria-hidden="true"></div>
    <div class="cover" id="cover">
      <img id="thumbnail" alt="" decoding="async" fetchpriority="high" hidden>
      <div class="cover-fallback"><span aria-hidden="true">♬</span></div>
      <div class="cover-shade" aria-hidden="true"></div>
      <div class="track-overlay">
        <div class="stage-badges">
          <span id="position-badge" class="badge" hidden></span>
          <span id="prefetch-badge" class="badge quiet" hidden></span>
        </div>
        <h1 id="track-title" class="track-title skeleton-text">Carregando faixa</h1>
        <p id="track-artist" class="artist">Só um instante</p>
      </div>
    </div>
    <div class="player-panel">
      <div class="status-line">
        <span id="status-badge" class="badge">Na fila</span>
        <span id="processing-text" class="subtle" role="status" aria-live="polite">Preparando sua faixa…</span>
      </div>
      <div id="player-wrap" class="player-wrap" hidden>
        <audio id="audio-player" class="audio-engine" preload="metadata" controls>
          Seu navegador não oferece suporte ao player de áudio.
        </audio>
        <div class="custom-player" aria-label="Player da faixa">
          <button id="player-toggle" class="player-toggle" type="button" aria-label="Reproduzir música">▶</button>
          <div class="timeline">
            <label class="sr-only" for="player-progress">Posição da música</label>
            <input id="player-progress" class="progress" type="range" min="0" max="1000" step="1" value="0">
            <div class="time-block" aria-live="off">
              <span id="current-time">0:00</span><span aria-hidden="true">/</span><span id="duration-time">0:00</span>
            </div>
          </div>
          <button id="mute-button" class="icon-button desktop-control" type="button" aria-label="Silenciar">🔊</button>
          <label class="sr-only" for="player-volume">Volume</label>
          <input id="player-volume" class="volume-slider desktop-control" type="range" min="0" max="1" step="0.01" value="0.8">
        </div>
      </div>
      <div id="reveal-area" class="reveal-area">
        <button id="reveal-button" class="button primary wide" type="button" disabled>Analisando tom…</button>
        <p id="game-message" class="message" role="status" aria-live="polite"></p>
      </div>
      <section id="answer-panel" class="answer-panel" hidden aria-live="polite">
        <p class="eyebrow">Resultado da análise</p>
        <p id="answer" class="answer"></p>
        <p id="confidence-note" class="subtle"></p>
        <div class="result-actions" role="group" aria-label="Como você se saiu?">
          <button class="button success" data-result="correct" type="button"><span aria-hidden="true">✓</span> Acertei</button>
          <button class="button danger" data-result="incorrect" type="button"><span aria-hidden="true">×</span> Errei</button>
        </div>
      </section>
      <div id="next-area" class="next-area" hidden>
        <button id="next-button" class="button secondary" type="button">Próxima música <span aria-hidden="true">→</span></button>
        <a class="text-link" href="/stats">Ver estatísticas</a>
      </div>
      <div id="finished-area" class="finished-area" hidden>
        <h2>Fim da playlist</h2>
        <button id="reshuffle-button" class="button primary" type="button">Embaralhar novamente</button>
      </div>
    </div>
  </article>
</section>
{% endblock %}

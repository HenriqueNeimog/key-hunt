<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b0c10">
  <title>{% block title %}Key Hunt{% endblock %}</title>
  <script>document.documentElement.classList.add("js");</script>
  <link rel="stylesheet" href="{{ url_for('static', path='/css/app.css') }}?v=5">
  <script defer src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script defer src="{{ url_for('static', path='/js/app.js') }}?v=5"></script>
</head>
<body data-page="{% block page %}base{% endblock %}">
  <a class="skip-link" href="#content">Pular para o conteúdo</a>
  <header class="site-header">
    <a class="brand" href="/" aria-label="Key Hunt — início" hx-boost="true">
      <img src="{{ url_for('static', path='/logo.png') }}" alt="Key Hunt" width="32" height="32">
    </a>
    <nav aria-label="Navegação principal">
      <a href="/stats" hx-boost="true">Estatísticas</a>
    </nav>
  </header>
  <main id="content">
    {% block content %}{% endblock %}
  </main>
</body>
</html>

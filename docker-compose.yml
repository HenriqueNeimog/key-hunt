services:
  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  web:
    build: .
    ports:
      - "8000:8000"
    environment: &key_hunt_environment
      KEY_HUNT_SECRET_KEY: replace-this-development-secret-before-production
      KEY_HUNT_PROCESSING_MODE: kafka
      KEY_HUNT_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KEY_HUNT_DATABASE_URL: sqlite:////data/key_hunt.db
      KEY_HUNT_MEDIA_DIR: /data/media
    volumes:
      - key-hunt-data:/data
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    command: ["uv", "run", "python", "-m", "app.worker"]
    environment: *key_hunt_environment
    volumes:
      - key-hunt-data:/data
    depends_on:
      kafka:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "uv", "run", "python", "-m", "app.worker", "--healthcheck"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  integration-tests:
    profiles: ["test"]
    build: .
    command: ["uv", "run", "pytest", "-q", "-m", "integration"]
    environment: *key_hunt_environment
    volumes:
      - key-hunt-data:/data
    depends_on:
      kafka:
        condition: service_healthy
      web:
        condition: service_healthy
      worker:
        condition: service_healthy

volumes:
  key-hunt-data:
